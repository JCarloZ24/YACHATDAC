        - generic [ref=f1e67]:
          - paragraph [ref=f1e68]: Today
          - heading "The work going on" [level=2] [ref=f1e69]
          - generic [ref=f1e70]:
            - article [ref=f1e71]:
              - paragraph [ref=f1e72]: Now
              - generic [ref=f1e73]:
                - heading [level=3] [ref=f1e74]:
                  - link "Right-way fire, springs, and two flux towers" [ref=f1e75] [cursor=pointer]:
                    - /url: /resources/right-way-fire-and-the-carbon-in-the-soil
                - paragraph [ref=f1e76]: The Iningai Rangers burn, fence, collect seed and bring springs back. Two towers measure what that does to the carbon in the soil — one on Country managed this way, one on grazed land, checked against each other.
                - figure [ref=f1e77]:
                  - generic [ref=f1e78]:
                    - img "Rangers at the burn" [ref=f1e80]
                    - img "A spring coming back" [ref=f1e82]
                    - img "The flux tower on Country" [ref=f1e84]
                - paragraph [ref=f1e85]: They can do this work because, seven years ago, this stopped being someone else's station.
                - paragraph [ref=f1e86]: Living memory
                - link "What the towers are showing →" [ref=f1e87] [cursor=pointer]:
                  - /url: /resources/right-way-fire-and-the-carbon-in-the-soil
            - article [ref=f1e88]:
              - paragraph [ref=f1e89]: "2022"
              - generic [ref=f1e90]:
                - heading [level=3] [ref=f1e91]:
                  - link "The site is studied with its owners" [ref=f1e92] [cursor=pointer]:
                    - /url: /resources/fifteen-thousand-markings-read-in-order
                - paragraph [ref=f1e93]: A two-year study documents Marra Wonga from both archaeological and Iningai perspectives, with Iningai community members as research partners rather than subjects. Ten clusters of engravings, read south to north, tell the Seven Sisters in sequence.
                - figure [ref=f1e94]:
                  - img "Researchers and community members working together on site" [ref=f1e99]
                - paragraph [ref=f1e100]: Iningai people could be partners in that research because, by then, there were Iningai people the researchers had to ask.
                - paragraph [ref=f1e101]: Science
