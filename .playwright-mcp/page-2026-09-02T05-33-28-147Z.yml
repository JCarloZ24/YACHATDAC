              - generic [ref=f1e105]:
                - heading "Research & discovery" [level=3] [ref=f1e106]
                - paragraph [ref=f1e107]: The bore, the recorders, the flux towers, the plants under study. What has been found on Turraburra so far, and how it was found.
                - link "Explore our discoveries →" [ref=f1e108] [cursor=pointer]:
