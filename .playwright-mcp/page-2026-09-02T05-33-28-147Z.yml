          - generic [ref=f1e44]:
            - article [ref=f1e45]:
              - paragraph [ref=f1e46]: Within five years
              - generic [ref=f1e47]:
                - heading [level=3] [ref=f1e48]:
                  - link "The Cultural Knowledge Precinct" [ref=f1e49] [cursor=pointer]:
                    - /url: /resources/cultural-knowledge-precinct
                - paragraph [ref=f1e50]: Exhibitions, teaching, research accommodation and a place for community to gather, in one place at Turraburra. Master planning is underway.
                - figure "Concept render of the Cultural Knowledge Precinct." [ref=f1e51]
                - paragraph [ref=f1e58]: It is being built because there is something here worth building it for.
