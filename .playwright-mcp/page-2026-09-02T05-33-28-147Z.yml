              - generic [ref=f1e63]:
                - heading "Partnerships" [level=3] [ref=f1e64]
                - paragraph [ref=f1e65]: A researcher on Country is a guest on Country. Partnerships here are expected to give something back to the land and the people.
                - link "Partner with us →" [ref=f1e66] [cursor=pointer]:
