                - paragraph [ref=e263]: "6"
                - paragraph [ref=e264]: "7"
                - paragraph [ref=e265]: "8"
            - paragraph [ref=e267]: Of eight
          - generic [ref=e268]:
            - paragraph [ref=e269]: On release
            - paragraph [ref=e270]: Eight days in it held a puddle. The next morning there was a koala standing at it.
          - paragraph [ref=e271]: ◇ Stand-in · 1.87.1 the dry creek — the restored waterhole holding water has never been photographed
        - generic [ref=e273]:
          - paragraph [ref=e274]: The work
          - heading "The work" [level=2] [ref=e275]
          - paragraph [ref=e276]: What Rangers do on the ground. Seven streams, running at once, all year.
          - generic [ref=e277]:
            - article [ref=e278]:
              - generic [ref=e279]:
                - paragraph [ref=e280]: "01"
                - generic [ref=e281]:
                  - heading "Fire-stick farming" [level=3] [ref=e282]
                  - paragraph [ref=e283]: Low-intensity fire-stick farming at the right time of year — reducing fuel loads, encouraging germination and breaking Country into a patchwork that carries more life than unburnt or hot-burnt ground.
                  - paragraph [ref=e284]: "Rangers practise fire-stick farming and look for black ash rather than scorched ground. It runs as workshops as well as work, so more people come off them able to do it. Soil is tested before and after: carbon here began only 30 centimetres down, and one paddock was recorded working as a carbon sink within eight to nine months of a burn."
            - article [ref=e286]:
              - generic [ref=e287]:
                - paragraph [ref=e288]: "02"
                - generic [ref=e289]:
                  - heading "Springs and waterholes" [level=3] [ref=e290]
                  - paragraph [ref=e291]: Bringing cultural wetlands and spring networks back to holding water on their own.
                  - paragraph [ref=e292]: The spring above is one of them.
            - article [ref=e294]:
              - generic [ref=e295]:
                - paragraph [ref=e296]: "03"
                - generic [ref=e297]:
                  - heading "Seed and groundcover" [level=3] [ref=e298]
                  - paragraph [ref=e299]: Collecting seed when Country produces it, holding it, and putting it back into revegetation.
                  - paragraph [ref=e300]: Seed is available when the season decides, not when a work plan says so, which is why the year is organised around the country rather than the other way round.
            - article [ref=e302]:
              - generic [ref=e303]:
                - paragraph [ref=e304]: "04"
                - generic [ref=e305]:
                  - heading "Fencing and paddocks" [level=3] [ref=e306]
                  - paragraph [ref=e307]: New fencing built corner assembly by corner assembly, giving paddocks that can be managed separately.
                  - paragraph [ref=e308]: Rangers built it themselves, learning the job as it went. It turned out to matter more than expected — without separate paddocks the flux tower comparison would not have been possible.
            - article [ref=e310]:
              - generic [ref=e311]:
                - paragraph [ref=e312]: "05"
                - generic [ref=e313]:
                  - heading "Weeds and feral animals" [level=3] [ref=e314]
                  - paragraph [ref=e315]: Continuous control targeted at the places doing the most damage — waterholes, regrowth and rock shelters.
                  - paragraph [ref=e316]: Control is ongoing rather than a one-off campaign, and it runs alongside the restoration work rather than separately from it.
            - article [ref=e318]:
              - generic [ref=e319]:
                - paragraph [ref=e320]: "06"
                - generic [ref=e321]:
                  - heading "Sites and access" [level=3] [ref=e322]
                  - paragraph [ref=e323]: Protecting Marra Wonga and the other recorded sites, and controlling how people reach them.
                  - paragraph [ref=e324]: Road alignments were set from cultural mapping so routes work around sites rather than through them. Access is guided. Ecological and cultural mapping of the property tells us what is where and what must not be disturbed.
                  - paragraph [ref=e327]: What stays here
            - article [ref=e329]:
              - generic [ref=e330]:
                - paragraph [ref=e331]: "07"
                - generic [ref=e332]:
                  - heading "Monitoring" [level=3] [ref=e333]
                  - paragraph [ref=e334]: Recording what is here and what changes, so management decisions and credit claims both rest on evidence.
                  - paragraph [ref=e335]: Four acoustic recorders log birds and frogs into a database held with QUT, two of them down at the springs. Cameras on the towers photograph five hundred metres around, tracking vegetation and flowering through the year. Soil samples from the bore are held by QUT.
