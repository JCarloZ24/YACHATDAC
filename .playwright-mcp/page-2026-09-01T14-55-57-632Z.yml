                  - generic [aria-hidden] [ref=e171]: −
                - generic [ref=e172]:
                  - paragraph [ref=e173]: Ranger work is currently grant funded, and grant cycles are shorter than the work. Losing ranger funding before commercial income is established is the single biggest risk to everything on this page.
                  - paragraph [ref=e174]: Guesting, native foods, natural capital and fee-for-service land management are being built to carry the Rangers independently of grant rounds.
