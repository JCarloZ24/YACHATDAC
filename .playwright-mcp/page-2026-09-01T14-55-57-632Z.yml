                  - generic [aria-hidden] [ref=e156]: −
                - generic [ref=e157]:
                  - paragraph [ref=e158]: Marra Wonga carries historic graffiti from visitors going back over a century, and artefacts near the shelter have been removed by station owners and tourists since the late 1800s. Stock and feral animals damage sites simply by sheltering at them.
                  - paragraph [ref=e159]: Roads are aligned to go around sites rather than through them, and access is controlled and guided.
