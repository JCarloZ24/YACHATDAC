        - generic [ref=e250]:
          - paragraph [ref=e251]: The spring · Stream 02
          - paragraph [ref=e252]: One spring had been trampled flat by a century of stock. Rangers cleaned the waterhole out, planted grasses around it and carted a thousand litres to it twice a day through drought.
          - generic [ref=e253]:
            - paragraph [ref=e254]: Day
            - generic [ref=e255]:
