                    - heading "A century of overgrazing" [level=3] [ref=e99]
                    - generic [aria-hidden] [ref=e100]: −
                  - generic [ref=e101]:
                    - paragraph [ref=e102]: Turraburra was run as a sheep and cattle station from the 1880s. Continuous grazing strips groundcover, compacts soil and stops native grasses setting seed, so Country loses its ability to hold water and recover on its own.
                    - paragraph [ref=e103]: Fencing lets us rest paddocks and manage them separately. Seed collection and replanting rebuild what grazing removed.
